<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sincelejo S.A.S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81'
                        },
                        surface: '#F4F4F4'
                    },
                    boxShadow: {
                        'soft': '0 1px 3px 0 rgba(0,0,0,0.04), 0 1px 2px -1px rgba(0,0,0,0.03)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface dark:bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="w-full max-w-sm">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-primary-500 rounded-2xl mb-4">
                <img src="{{ url_for('static', filename='Images/FONDO.png') }}" alt="Logo" class="w-8 h-8 object-contain brightness-0 invert">
            </div>
            <h1 class="text-xl font-bold text-slate-800 dark:text-white">Crea tu cuenta</h1>
            <p class="text-sm text-slate-400 dark:text-slate-500 mt-1">Sistema de Gestion Logistica Sincelejo S.A.S</p>
        </div>

        <!-- Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-soft border border-slate-200 dark:border-slate-700/50 p-7">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-3.5 text-sm rounded-lg {% if category == 'danger' %}bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800/50{% elif category == 'warning' %}bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800/50{% else %}bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/50{% endif %}">
                            <div class="flex items-center gap-2.5">
                                <i data-lucide="{% if category == 'danger' %}alert-circle{% elif category == 'warning' %}alert-triangle{% else %}check-circle{% endif %}" class="w-4 h-4 flex-shrink-0"></i>
                                <span>{{ message }}</span>
                            </div>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/register" method="POST" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombres</label>
                        <input type="text" name="nombres" required
                               class="block w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400"
                               placeholder="Juan">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Apellidos</label>
                        <input type="text" name="apellidos" required
                               class="block w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400"
                               placeholder="Perez">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Correo Electronico</label>
                    <input type="email" name="correo" required
                           class="block w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400"
                           placeholder="usuario@sincelejo.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contrasena</label>
                    <input type="password" name="password" required
                           class="block w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400"
                           placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Rol de Usuario</label>
                    <select name="rol"
                            class="block w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-white rounded-xl focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 outline-none transition-all cursor-pointer">
                        <option value="Usuario" class="dark:bg-slate-700">Usuario Estandar</option>
                        <option value="Gerente" class="dark:bg-slate-700">Gerente de Operaciones</option>
                        <option value="Administrador" class="dark:bg-slate-700">Administrador de Sistema</option>
                    </select>
                </div>

                <button type="submit"
                        class="w-full bg-primary-500 hover:bg-primary-600 text-white font-semibold py-2.5 px-4 rounded-xl transition-all text-sm mt-1 focus:ring-4 focus:ring-primary-500/20">
                    Registrarse ahora
                </button>
            </form>

            <p class="text-center text-sm text-slate-400 dark:text-slate-400 mt-6">
                Ya tienes una cuenta?
                <a href="{{ url_for('login') }}" class="text-primary-500 dark:text-primary-400 hover:text-primary-600 font-semibold transition-colors">Inicia sesion aqui</a>
            </p>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
